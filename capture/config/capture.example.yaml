# Capture service configuration -- the complete reference.
#
# Copy to capture/config/capture.yaml and edit. There are no defaults in
# Python: a missing key is a startup error naming the key, so this file is the
# only place any tunable lives.
#
# Paths are relative to the repo root unless absolute.
#
# Any value may contain ${VAR} or ${VAR:-fallback}, expanded from the
# environment at load time. Use that for anything secret; an unset ${VAR} with
# no fallback is a fatal error rather than an empty string. The same-host
# publisher needs no credentials, so nothing here requires one today.

version: 1

# =============================================================================
# MOTION SENSOR
# =============================================================================
motion:
  # Sensor type: pir (HC-SR501) or tof (VL53L1X)
  sensor_type: tof

  # --- ToF-specific settings (VL53L1X on I2C) ---
  # I2C bus. Only bus 1 (GPIO 2/3, physical pins 3/5) is supported.
  i2c_bus: 1
  # I2C address in hex. Default 0x29 can be changed by soldering ADDR pin.
  i2c_address: 0x29
  # --- what counts as a detection ---------------------------------------------
  # baseline_margin_mm selects the detection model. SET (the default here) means
  # baseline-relative: learn the resting distance of the empty scene, fire when a
  # reading departs from it by at least this many mm, either nearer or farther.
  # null means absolute: fire on anything inside detection_range_mm.
  #
  # Absolute DOES NOT WORK AT THIS FEEDER and the margin must stay set. The perch
  # is bolted in the beam, so "is anything within 500 mm?" is permanently true:
  # the gate latched on the first poll after start and never produced another
  # rising edge, and birds landing on an already-triggered sensor generated no
  # event at all. Every absolute range behaved identically, 300 mm and 1300 mm
  # alike (measured 2026-10-06), which is the signature of this fault and not of
  # a badly chosen number.
  #
  # 7 mm passed the 2026-10-09 Pi check: the empty scene stayed within 6 mm of
  # its baseline over 30 s, while a hand at the landing spot shifted the range
  # about 11 mm. A 20 mm margin missed that hand. Bird detection is not yet
  # measured; recheck with deploy/tof_baseline.py after moving the mount.
  #   too small -> empty-port triggers (cheap: clip discarded by the novelty gate)
  #   too large  -> missed visits (unrecoverable, and no log line is produced)
  baseline_margin_mm: 7

  # Clear-state readings in the running median. 30 at 10 Hz is a 3 s window:
  # enough to outvote single bad reads, short enough to re-learn within seconds
  # of the mount being nudged. Readings taken while the gate is DETECTED are
  # never learned from, so a bird at the port cannot become part of the baseline.
  baseline_samples: 30

  # Outer bound on the feeder scene, in mm. In baseline mode this is no longer
  # the trigger: it only rejects returns from the garden beyond the feeder, which
  # must not fire and must not move the baseline. In absolute mode (margin null)
  # it is the trigger threshold.
  detection_range_mm: 500

  # --- region of interest -----------------------------------------------------
  # The sensor's 16x16 SPAD array. roi_size is the window side in SPADs (4-16;
  # null = the full ~27 degree cone), roi_center the centre SPAD (0-255).
  #
  # Narrowing is a REMEDY for something parked in the beam, not a default. Start
  # at 16 (the full ~27 degree cone) and only narrow if an empty port reads
  # occupied -- narrowing costs detections, and at this mounting it cost a real
  # one. MEASURED 2026-10-06, sensor mounted beside the bottle neck:
  #
  #   config        empty scene          something at the perch
  #   16x16 c=199   2-17% valid, noisy   100% @ 13 cm
  #   4x4   c=199   0% valid, 3/3 runs   100% @ 10-12 cm, 3/3 runs
  #
  # The bottle is NEARER (13 cm) than the perch (~20 cm) and the sensor reports
  # one dominant return, so while it IS in the beam the full array masks the
  # bird behind it and no threshold downstream can undo that. 4x4 at centre 199
  # excluded it.
  #
  # But a narrow window costs real visits. 2026-10-09, three settings in one
  # afternoon against observed sunbird visits:
  #   4x4  (~1.4 cm at 0.114 m)  missed a visit outright
  #   8x8  (~2.8 cm)             caught one, missed another
  #   16x16 (full ~27 deg cone)  ~1.5 triggers/min on an EMPTY port
  #
  # 16 is the right default anyway, because those false triggers were all scored
  # `unknown` by the novelty gate and RETAINED, never published. A false trigger
  # costs a discarded clip and some card wear; a missed visit is unrecoverable
  # and silent -- the log just shows nothing. Narrowing moves the precision
  # burden onto the sensor, which is the wrong layer: the trigger should be
  # generous and the classifier plus allowlist are the precision filter.
  #
  # Both narrow settings were validated against a HAND, which fills a 1.4 cm
  # window and a sunbird does not. Never calibrate this against a proxy target.
  # Narrow only if an empty port reads OCCUPIED (something parked in the beam),
  # and then re-check against real visits, not a hand.
  #
  # Re-measure after ANY change to the mount, and always with ranging restarted
  # between configurations -- ROI readings taken without a restart do not
  # reproduce. Smaller windows see less: 4x4 is about 7 degrees.
  roi_size: 16
  roi_center: 199
  # Time to wait after power-on for sensor to stabilize (seconds).
  warmup_seconds: 1.0
  # Polling rate (Hz). Higher = faster response, higher CPU. 10 Hz is typical.
  read_rate_hz: 10.0
  # How long the port must read EMPTY before the trigger re-arms. Detection is
  # instant; only the release is damped.
  #
  # Not optional padding. MEASURED at the feeder 2026-10-06: only ~50% of polls
  # return a distance, and the sensor reports "nothing in range" as an invalid
  # reading too, so a dropout mid-visit looks exactly like the bird leaving.
  # At 0 this fired 44 times in 60 seconds for one continuous presence.
  #
  # Tuning: raise it if one visit still becomes several events; lower it if two
  # birds arriving in quick succession are merged into one. Must stay well under
  # capture.cooldown_seconds, which is the coarse guard on top of this.
  release_seconds: 1.0
  # Safety valve: if something reads in range this long without ever clearing,
  # the gate is assumed stuck. The service logs a WARNING naming the distance and
  # re-arms, so the next poll fires again.
  #
  # Why this exists: a target parked in the beam -- the perch itself, a leaf, a
  # spider web -- holds the trigger down permanently and the feeder silently
  # stops recording. There is otherwise NOTHING in the log to distinguish that
  # from a quiet afternoon, and it was misdiagnosed twice on 2026-10-06.
  #
  # Keep it well above a realistic visit. A bird that does sit longer just gets a
  # second event, which capture.cooldown_seconds already rate-limits. null
  # disables the valve.
  max_hold_seconds: 60.0
  # Unused: the sensor is always polled (an interrupt saves no power on a Pi 4B,
  # which never sleeps). Kept so older configs still load; a value only logs a
  # warning.
  interrupt_pin: null

# =============================================================================
# GPIO -- HC-SR501 PIR (ignored if motion.sensor_type is tof)
# =============================================================================
gpio:
  # BCM numbering, not physical pin numbers. GPIO4 is physical pin 7.
  # See README for the wiring table.
  pin: 4
  # gpiozero's polling rate for its own edge-detection thread. The service
  # itself is event-driven and blocks; this only sets how finely gpiozero
  # samples the pin.
  sample_rate_hz: 10.0
  # 1 = report the raw pin state with no averaging. The HC-SR501 debounces in
  # hardware and holds its output high for its whole retrigger window, so
  # averaging on top only delays the first edge -- the one that catches a bird
  # landing.
  queue_len: 1
  # The HC-SR501's pyroelectric sensor emits spurious highs while it settles
  # after power-up. Without this the service records a burst of nothing every
  # time it restarts. The datasheet says up to a minute.
  warmup_seconds: 60.0

# =============================================================================
# CAMERA -- Camera Module 3 via picamera2
# =============================================================================
camera:
  # 720p. The classifier centre-crops to 224px, so more pixels are thrown away
  # rather than used; this buys margin for the crop without paying 1080p's
  # bitrate and thermal cost. Both dimensions must be even (H.264 4:2:0).
  width: 1280
  height: 720
  framerate: 25
  # ~4 Mbps -> roughly 4 MB for an 8-second clip. The Pi 4B keeps the hardware
  # H.264 encoder the Pi 5 dropped (reports/deployment.md), so this costs
  # almost no CPU on this board.
  bitrate_kbps: 4000
  # Fixed focus in DIOPTRES (1 / distance in metres). null leaves the driver
  # default alone. 8.8 is about 0.114 m, the measured camera-to-perch distance.
  #
  # This is not optional on Camera Module 3, and its absence was invisible for
  # six weeks. picamera2 leaves imx708 in AfMode.Manual at LensPosition 1.0 --
  # ONE METRE -- unless something sets it, and nothing did, so every clip was
  # focused about nine times too far away: sharp background, blurred bird.
  #
  # MEASURED 2026-10-09 by running continuous AF with a target at the perch and
  # reading the lens back: it swept from 1.00 m and settled at 8.2-9.4 dioptres
  # over 40 s, median 8.8. That agrees with the ToF, which ranges the same
  # target at 10-12 cm.
  #
  # Manual, not continuous AF: the perch does not move, and continuous AF would
  # hunt against an empty port and leave the first frames of a visit -- exactly
  # the ones the classifier samples -- mid-sweep. Re-measure if the camera moves.
  lens_position: 8.8
  # AGC/AWB convergence. Recording immediately gives a clip whose first frames
  # are mis-exposed -- and those are the frames the classifier samples first.
  warmup_seconds: 1.0

# =============================================================================
# CAPTURE -- clip length, cooldown, concurrency
# =============================================================================
capture:
  clip_seconds: 8.0
  # Starts when a trigger is ADMITTED. Must be >= clip_seconds or a second
  # trigger could start a recording while the first is still being written;
  # that is checked at load time and is fatal.
  cooldown_seconds: 30.0
  # What to do with a trigger arriving while the previous event is still
  # recording, classifying or publishing:
  #   queue -- hold it, up to max_queued, and handle it next
  #   drop  -- discard it, with a log line
  on_busy: queue
  # Events waiting BEHIND the one in flight. 1 is deliberate: a deeper queue
  # mostly accumulates re-triggers from the same visit, which the cooldown is
  # already there to suppress.
  max_queued: 1

# =============================================================================
# STORAGE
# =============================================================================
storage:
  # In-progress recordings. Anything here at startup is crash debris and is
  # deleted -- an unfinalised H.264 stream is not a clip.
  work_dir: var/capture/work
  # Recorded, classified, on the allowlist, publication NOT yet confirmed.
  # Never deleted to make room. This is the promise that no clip is lost.
  pending_dir: var/capture/pending
  # Clips the classifier abstained on, kept for a human look. These ARE
  # evictable, oldest first.
  review_dir: var/capture/review
  # Recording stops rather than filling the card. Review clips are evicted
  # first; pending clips never are.
  min_free_mb: 1024
  # Hard ceiling on unconfirmed clips. Reaching it stops recording, because the
  # alternative is deleting evidence. Raise it only alongside min_free_mb.
  max_pending_clips: 200
  # With publish.retain_unknown on, these clips are the labelled set the novelty
  # refit needs, so eviction discards evidence -- it hit 84/100 within an hour
  # on 2026-10-09. ~600 clips is about 1.2 GB; min_free_mb still backstops it.
  max_review_clips: 600
  # Delete the local copy once publication is confirmed. false keeps it under
  # review_dir, which is useful while you are still checking the model's work.
  delete_after_publish: true

# =============================================================================
# CLASSIFIER
# =============================================================================
classifier:
  # false records and retains everything unclassified -- useful for collecting
  # field footage before the model is deployable, which is exactly the data
  # ASSUMPTIONS.md A27 says the project needs.
  enabled: true
  onnx_path: ml/data/export/birdcam_student.onnx
  # Temperature and the fitted per-class thresholds come from here. Without it
  # the confidences recorded are uncalibrated, and confidence gates capture.
  operating_points: ml/reports/operating_points_finetuned.json
  # Per-class range prior for the deployment site. null disables it.
  site_prior: ml/config/sites/rondebosch.yaml
  # Frames per second sampled from each clip. deployment.md for the Pi 4B:
  # "Classify SAMPLED frames only, never every frame."
  sample_fps: 2.0
  # Cap per clip. 12 frames at 2 fps covers the first 6 seconds of an 8-second
  # clip, which is where a landing bird actually is -- and with a PIR trigger
  # the arrival IS the trigger, so the bird is at the start by construction.
  #
  # MEASURED 2026-08-27, do not raise this hoping to catch more visits. Across
  # 44 Tier A field clips, clips firing by frames sampled:
  #   4 frames (2s)  79.5%
  #   8 frames (4s)  95.5%
  #  12 frames (6s) 100.0%
  #  16/24/all      100.0%
  # It saturates exactly here. More frames buy nothing and cost Pi inference
  # time linearly.
  max_frames: 12
  # XNNPACK first: it has NEON INT8 kernels and is the recommended provider for
  # the Pi 4B (reports/deployment.md). Falls back if not built in.
  providers:
    - XnnpackExecutionProvider
    - CPUExecutionProvider
  # Guard against shipping a graph and a calibration that describe different
  # models. Set to the string you expect in the operating points' `source`
  # field, or null to skip this particular check.
  expect_source: null
  # ASSUMPTIONS.md A26: the export currently on disk is a frozen-feature graph
  # while the thresholds were fitted on the fine-tuned checkpoint. The service
  # refuses to start on that pairing. Set true only to override deliberately --
  # nothing will fail, the labels will simply be wrong.
  allow_artefact_mismatch: false
  # Keep sampled frames on disk after classification, for debugging.
  keep_frames: false

  # --- open-set failsafe ------------------------------------------------------
  # Without this the softmax always returns one of the taxon classes, so a
  # squirrel or a hand refilling the feeder is reported as the least-bad bird.
  #
  # `energy` scores the logits the graph already emits, so it costs nothing and
  # needs no extra artefact. kNN is stronger but needs the 1,280-d pooled
  # features from the FROZEN backbone, which the current graph does not output
  # (A25, A26). The reference bundle for it is already built and waiting at
  # ml/data/export/novelty_knn.npz -- switching is a config change once the
  # graph emits features.
  #
  # THRESHOLD PROVENANCE. Measured 2026-08-27 on 11,050 real feeder frames with
  # the fine-tuned checkpoint. -5.669 rejects 10% of real bird FRAMES and flags
  # 41.6% of continuous-footage frames (~58% of which are genuinely empty).
  #
  # Do NOT use the -8.4859 that older comments suggest. That came from
  # reports/open_set.json, fitted on the frozen-probe model against web
  # photographs; against the fine-tuned model on real footage it gates almost
  # nothing. Same class of mismatch as the per-class thresholds fitted on web
  # photos while field confidence sits ~0.2 lower (A27).
  #
  # Why 10% and not something gentler: the frame-level cost does not reach the
  # visit. Measured across 44 Tier A field clips, every one still fires at every
  # reject rate tested up to 15% -- voting over 12 frames absorbs a few losses.
  # That sample is dense-bird cut footage though, so a PIR clip where the bird
  # lands late has fewer frames to spare. Lower this first if visits go missing.
  novelty:
    enabled: true
    scorer: energy          # energy | max_softmax | knn
    threshold: -5.669       # 10% of real bird frames rejected; see above
    reference: null         # .npz of reference features; knn only

# =============================================================================
# PUBLISH -- to the dashboard (web/)
# =============================================================================
publish:
  # `uncertain` means "probably a bird, but I cannot pin it down". A27 measured
  # the deployed system missing most real birds rather than recording
  # squirrels, and these clips are the only local evidence of what it misses.
  # Kept under max_review_clips, never published.
  retain_uncertain: true
  # Keep clips the open-set failsafe rejected as `unknown`, which are otherwise
  # deleted on sight. COMMISSIONING AID, not a steady-state setting.
  #
  # 2026-10-06, first unattended run on the ToF trigger: 14 clips in 3.5 hours,
  # every one rejected as unknown (novelty -3.81 to -4.80 against a -4.9434
  # threshold) and deleted immediately -- so there was no way to tell a bird the
  # gate had misjudged from a gust of wind. The threshold was fitted on the old
  # phone footage, not on this view, and cannot be tuned without the clips.
  #
  # Costs ~190 MB/day at that trigger rate, and storage.max_review_clips caps it
  # with oldest-first eviction. Set false once the novelty gate is trusted.
  retain_unknown: true
  # Attempts before a publish failure escalates from WARNING to ERROR. NOT a
  # give-up count: a clip whose publication is unconfirmed is never abandoned
  # and never deleted. Retries continue at backoff_max_seconds.
  escalate_after_attempts: 5
  backoff_initial_seconds: 5.0
  backoff_max_seconds: 900.0
  backoff_factor: 2.0

# =============================================================================
# LOGGING
# =============================================================================
logging:
  level: INFO
  file: var/capture/capture.log
  max_bytes: 5000000
  backup_count: 5
  # text -- readable, structured fields appended as key=value
  # json -- one object per line, for jq
  format: text

# =============================================================================
# EMPTY-FEEDER GATE -- checked on the recorded clip
# =============================================================================
# The classifier cannot tell an empty feeder from a bird (it memorised session
# backgrounds), so emptiness is decided geometrically at the feeding port
# against a background built ONLY from snapshots taken while the PIR is quiet.
# Triggered clips never update it: at a busy feeder a regular visitor would
# otherwise become the background and be discarded as empty.
#
# Fails open: no fresh background (the newest snapshot older than
# max_age_seconds), no port found, or mismatched frame sizes all mean "classify
# it". The threshold was measured on static session backgrounds; revalidate it
# with snapshots from the installed camera.
empty_gate:
  enabled: true
  placement: after_record
  threshold: 12.0
  background_frames: 6            # median of the newest snapshots
  snapshot_interval_seconds: 300
  quiet_seconds: 120              # no PIR edge for this long before a snapshot
  max_age_seconds: 900            # older background -> gate off until refreshed
  reference: null                 # optional known-empty seed frame (replay only)
