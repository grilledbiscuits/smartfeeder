# Deployment site: Rondebosch, Cape Town.
#
# The range prior downweights species that do not plausibly occur here. It is a
# soft prior, not a filter: every species keeps a non-zero weight, because
# vagrants happen and a model that CANNOT emit a rare species will never let you
# discover one.
#
# Weights are derived from real iNaturalist observation density within the
# radius below -- generated by `birdcam.data.range_prior`, not hand-written.

version: 1

site:
  name: Rondebosch, Cape Town
  lat: -33.9575
  lon: 18.4750
  radius_km: 25

prior:
  # weight = max(floor, (count / max_count) ** alpha)
  #
  # alpha softens the prior. At 1.0 the weights track raw observation counts and
  # the prior overwhelms the classifier; at 0.0 every species is equally likely
  # and the prior does nothing. Chosen by measurement -- see DECISIONS.md.
  alpha: 0.35
  # No species is ever impossible. A vagrant Neergaard's Sunbird in Cape Town is
  # vanishingly unlikely, not forbidden, and this floor is what preserves the
  # chance of recording one.
  floor: 0.02
  # Non-bird / fallback classes are left untouched at 1.0: the prior is about
  # geography, and "unknown" is not a species with a range.
  neutral_classes: [empty_feeder, insect, other_animal, obstruction]

